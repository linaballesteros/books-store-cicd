sonar.projectKey=linaballesteros_books-store-cicd
sonar.organization=linaballesteros

# This project's analysis scope is automatic: sonar.sources, sonar.tests and
# sonar.test.inclusions are ignored by the scanner (see its analysis-scope warning).
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,frontend/public/**,**/*.test.js,**/*.test.jsx,infra/tests/**

sonar.javascript.lcov.reportPaths=backend/lcov.info,frontend/coverage/lcov.info
sonar.python.coverage.reportPaths=infra/coverage.xml

# Vitest's setup only registers assertions and cleanup; it is not application
# behavior. Keep it in static analysis, but omit it from coverage calculations.

# Coverage is measured only on the modules that currently have tests, so the
# reported percentage reflects real, explainable coverage rather than a number
# inflated over untested inherited code. Exclusions are removed as each module
# gains its own tests. Frontend scope: cart, client services, error handling,
# formatting, auth/cart hooks, Login, CartScreen and ProtectedRoute. Remaining
# inherited screens and telemetry are not part of the unit coverage metric.
sonar.coverage.exclusions=frontend/tests/setup.js,backend/server.js,backend/config/**,backend/routes/**,backend/logging/**,backend/middleware/accessLogger.js,backend/middleware/sessionContext.js,backend/middleware/errorHandler.js,backend/controllers/authController.js,backend/controllers/bookController.js,backend/controllers/eventController.js,backend/services/orderService.js,backend/repositories/**,frontend/src/App.jsx,frontend/src/main.jsx,frontend/src/config/**,frontend/src/data/**,frontend/src/context/AuthContext.jsx,frontend/src/context/contexts.js,frontend/src/lib/api.js,frontend/src/lib/cartAnalytics.js,frontend/src/lib/queryClient.js,frontend/src/lib/queryKeys.js,frontend/src/hooks/useBooks.js,frontend/src/hooks/useOrders.js,frontend/src/components/Book.jsx,frontend/src/components/Carousel.jsx,frontend/src/components/Footer.jsx,frontend/src/components/Header.jsx,frontend/src/screens/BookScreen.jsx,frontend/src/screens/HomeScreen.jsx,frontend/src/screens/OrdersScreen.jsx,frontend/src/screens/OrderSuccessScreen.jsx,frontend/src/screens/StoresScreen.jsx,frontend/src/screens/ProfileScreen.jsx

sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
