sonar.projectKey=linaballesteros_books-store-cicd
sonar.organization=linaballesteros

sonar.sources=backend,frontend
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,frontend/public/**,**/*.test.js

sonar.tests=backend/tests
sonar.test.inclusions=**/*.test.js

sonar.javascript.lcov.reportPaths=backend/lcov.info

# Coverage is measured only on the modules that currently have tests, so the
# reported percentage reflects real, explainable coverage rather than a number
# inflated over untested inherited code. Exclusions are removed as each module
# gains its own tests (database-backed services and repositories are covered by
# the integration suite; the frontend by its own suite).
sonar.coverage.exclusions=backend/server.js,backend/config/**,backend/routes/**,backend/logging/**,backend/middleware/accessLogger.js,backend/middleware/sessionContext.js,backend/middleware/errorHandler.js,backend/controllers/authController.js,backend/controllers/bookController.js,backend/controllers/eventController.js,backend/services/orderService.js,backend/repositories/**,frontend/**

sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
