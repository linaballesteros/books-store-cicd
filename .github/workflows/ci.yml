name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Backend: unit tests, coverage and Docker image build
  # ---------------------------------------------------------------------------
  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Generate coverage report for SonarCloud
        run: npm run test:lcov

      # SonarCloud analyzes from the repository root, so the LCOV file paths
      # must be relative to the root (prefixed with "backend/").
      - name: Prefix coverage paths for SonarCloud
        run: sed -i 's|^SF:|SF:backend/|' lcov.info

      - name: Build Docker image
        run: docker build --build-arg NODE_IMAGE=node:24-alpine -t bookstore-backend:${{ github.sha }} .

      - name: Upload backend coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-backend
          path: backend/lcov.info
          if-no-files-found: error

  # Frontend runs in parallel with backend and database integration tests.
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_BASE_URL: /
      VITE_API_PREFIX: /api
      VITE_CURRENCY_LOCALE: es-CO
      VITE_CURRENCY_CODE: COP
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Lint
        run: npm run lint
      - name: Component and unit tests with coverage
        run: npm run test:coverage
      - name: Build production frontend
        run: npm run build
      - name: Build frontend image
        run: |
          docker build --build-arg NODE_IMAGE=node:24-alpine \
            --build-arg NGINX_IMAGE=nginx:stable-alpine \
            --build-arg VITE_API_BASE_URL=/ --build-arg VITE_API_PREFIX=/api \
            --build-arg VITE_CURRENCY_LOCALE=es-CO --build-arg VITE_CURRENCY_CODE=COP \
            -t bookstore-frontend:${{ github.sha }} .
      - name: Prefix coverage paths for joint analysis
        run: sed -i 's|^SF:|SF:frontend/|' coverage/lcov.info
      - name: Upload frontend coverage and test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-frontend
          path: |
            frontend/coverage/
            frontend/test-results/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Backend: integration tests against a real PostgreSQL database
  # ---------------------------------------------------------------------------
  backend-integration:
    name: backend-integration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: bookstore_test
          POSTGRES_USER: bookstore_app
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bookstore_app -d bookstore_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Load schema and seed
        env:
          PGPASSWORD: test_password
        run: |
          psql -h localhost -U bookstore_app -d bookstore_test -v ON_ERROR_STOP=1 -f ../database/schema.sql
          psql -h localhost -U bookstore_app -d bookstore_test -v ON_ERROR_STOP=1 -f ../database/seed.sql

      - name: Run integration tests
        env:
          RUN_DB_TESTS: '1'
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_NAME: bookstore_test
          DB_USER: bookstore_app
          DB_PASSWORD: test_password
        run: npm run test:integration

  # A single analysis receives both reports; separate scans would overwrite
  # each other's coverage in the same SonarCloud project.
  sonar:
    name: sonar
    needs: [backend, frontend, backend-integration]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Download backend coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-backend
          path: backend
      - name: Download frontend coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-frontend
          path: frontend
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8
        with:
          projectBaseDir: ${{ github.workspace }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

  publish:
    name: publish-${{ matrix.component }}
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [backend, frontend, backend-integration, sonar]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    env:
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
      COMPONENT: ${{ matrix.component }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check publishing configuration
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || { echo 'Configure repository variable DOCKERHUB_USERNAME'; exit 1; }
          test -n "$DOCKERHUB_TOKEN" || { echo 'Configure repository secret DOCKERHUB_TOKEN'; exit 1; }
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and publish both architectures
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.component }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/bookstore-${{ matrix.component }}:${{ github.sha }}
          build-args: |
            NODE_IMAGE=node:24-alpine
            NGINX_IMAGE=nginx:stable-alpine
            VITE_API_BASE_URL=/
            VITE_API_PREFIX=/api
            VITE_CURRENCY_LOCALE=es-CO
            VITE_CURRENCY_CODE=COP
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - name: Verify platform manifest and record immutable reference
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          image="$DOCKERHUB_USERNAME/bookstore-$COMPONENT@$IMAGE_DIGEST"
          docker buildx imagetools inspect --raw "$image" > platforms.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          manifest = json.loads(Path('platforms.json').read_text())
          platforms = {m['platform']['os']+'/'+m['platform']['architecture'] for m in manifest['manifests']}
          assert {'linux/amd64','linux/arm64'} <= platforms, platforms
          component = os.environ['COMPONENT']
          record = {'component': component, 'commit': os.environ['GITHUB_SHA'],
                    'image': os.environ['DOCKERHUB_USERNAME']+'/bookstore-'+component+'@'+os.environ['IMAGE_DIGEST'],
                    'tag': os.environ['GITHUB_SHA'], 'platforms': sorted(platforms - {'unknown/unknown'})}
          Path('image-'+component+'.json').write_text(json.dumps(record, indent=2))
          PY
      - name: Upload image reference
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.component }}
          path: image-${{ matrix.component }}.json
          if-no-files-found: error

  release:
    name: release
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Download image references
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          merge-multiple: true
      - name: Assemble paired release for CD
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          records = {c: json.loads(Path('image-'+c+'.json').read_text()) for c in ['backend','frontend']}
          assert all(r['commit'] == os.environ['GITHUB_SHA'] for r in records.values())
          release = {'commit': os.environ['GITHUB_SHA'], 'images': records}
          Path('release.json').write_text(json.dumps(release, indent=2))
          PY
      - name: Upload release manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-manifest
          path: release.json
          if-no-files-found: error
