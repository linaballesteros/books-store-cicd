name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Backend: unit tests, coverage, Docker image build and SonarCloud analysis
  # ---------------------------------------------------------------------------
  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Generate coverage report for SonarCloud
        run: npm run test:lcov

      # SonarCloud analyzes from the repository root, so the LCOV file paths
      # must be relative to the root (prefixed with "backend/").
      - name: Prefix coverage paths for SonarCloud
        run: sed -i 's|^SF:|SF:backend/|' lcov.info

      - name: Build Docker image
        run: docker build --build-arg NODE_IMAGE=node:24-alpine -t bookstore-backend:${{ github.sha }} .

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8
        with:
          projectBaseDir: ${{ github.workspace }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

  # ---------------------------------------------------------------------------
  # Backend: integration tests against a real PostgreSQL database
  # ---------------------------------------------------------------------------
  backend-integration:
    name: backend-integration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: bookstore_test
          POSTGRES_USER: bookstore_app
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bookstore_app -d bookstore_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Load schema and seed
        env:
          PGPASSWORD: test_password
        run: |
          psql -h localhost -U bookstore_app -d bookstore_test -v ON_ERROR_STOP=1 -f ../database/schema.sql
          psql -h localhost -U bookstore_app -d bookstore_test -v ON_ERROR_STOP=1 -f ../database/seed.sql

      - name: Run integration tests
        env:
          RUN_DB_TESTS: '1'
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_NAME: bookstore_test
          DB_USER: bookstore_app
          DB_PASSWORD: test_password
        run: npm run test:integration
